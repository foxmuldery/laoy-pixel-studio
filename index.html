<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>老y像素工坊</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#07080c; --ink:#f3efe8; --muted:#8b90a0; --gold:#ead9ad; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:var(--bg); color:var(--ink); font-family:"Noto Sans SC",sans-serif; font-weight:300; display:flex; flex-direction:column; align-items:center; }
    header { width:min(420px, calc(100% - 32px)); padding:22px 0 8px; display:flex; justify-content:flex-end; }
    .enter { border:1px solid var(--gold); color:var(--gold); padding:7px 14px; font-size:12px; letter-spacing:.16em; text-decoration:none; }
    main { width:min(420px, calc(100% - 32px)); display:flex; flex-direction:column; align-items:center; padding-bottom:36px; }
    .poster { width:100%; border-radius:4px; display:block; }
    .btn { margin-top:22px; display:inline-flex; padding:12px 28px; background:var(--gold); color:#16140f; letter-spacing:.18em; font-size:13px; font-weight:500; text-decoration:none; }
    .privacy { width:min(420px, calc(100% - 32px)); padding:8px 0 36px; color:var(--muted); font-size:12px; line-height:1.7; text-align:center; }
    .privacy h2 { font-family:"Noto Serif SC",serif; font-size:14px; letter-spacing:.16em; color:var(--ink); margin-bottom:10px; }
    footer { padding-bottom:28px; color:#5c6170; font-size:10px; letter-spacing:.2em; }
  </style>
</head>
<body>
  <header><a class="enter" href="https://laoypixel.grok.me/" target="_blank" rel="noopener">进入工坊</a></header>
  <main>
    <img class="poster" src="poster.jpg" alt="老y像素工坊" />
    <a class="btn" href="https://laoypixel.grok.me/" target="_blank" rel="noopener">进入工坊</a>
  </main>
  <section class="privacy" id="privacy">
    <h2>隐私政策</h2>
    <p>照片默认在浏览器本地处理，用于生成像素 GIF。不收集相册，不出售个人信息。</p>
    <p>关闭页面后，未导出的内容不会保存。</p>
  </section>
  <footer>LAOY PIXEL STUDIO</footer>
</body>
</html>
